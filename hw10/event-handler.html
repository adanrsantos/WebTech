<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JavaScript Title</title>
<link href="assets/css/bootstrap.css" rel="stylesheet">
</head>

<body>
    <div id="page">
        <h1>List King</h1>
        <h2>New Account</h2>
        <div class="form-group has-default" id="unGroup-username">
            <label class="control-label" for="username">Create a username: </label>
            <input class="form-control" type="text" id="username">
            <span id="feedback-username" class="help-block"></span>
        </div>
        <div class="form-group has-default" id="unGroup-password">
            <label class="control-label" for="password">Create a password: </label>
            <input class="form-control" type="password" id="password" />
            <span id="feedback-password" class="help-block"></span>
        </div>        
        <input type="submit" value="sign up!" />
    </div>
    <script src="assets/js/event-handler.js"></script>
</body>
</html>
